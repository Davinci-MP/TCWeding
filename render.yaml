# Render Blueprint — server TCWedding (API + SQLite + ảnh). Vercel giữ phần trang tĩnh và
# chuyển /api/* và /media/* sang service này (xem vercel.json).
# Ổ đĩa bền vững cần gói trả phí; có ổ đĩa thì service chạy 1 instance và deploy sẽ gián đoạn ngắn.
services:
  - type: web
    name: tcwedding-api
    runtime: node
    plan: starter
    region: singapore
    branch: main
    # NODE_ENV=production cũng có hiệu lực lúc build -> cần --include=dev để có Vite
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: tcwedding-data
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: WATERMARK_FILE
        value: /var/data/brand/watermark.png
      - key: WATERMARK_ENABLED
        value: "false"
      - key: MAX_UPLOAD_MB
        value: "25"
      - key: SESSION_DAYS
        value: "7"
      # trình duyệt gửi Origin là tên miền chính; Host tới Render là onrender.com
      - key: ALLOWED_ORIGINS
        value: https://www.tcwedding.vn,https://tcwedding.vn
      # yêu cầu đi qua proxy Vercel rồi proxy Render
      - key: TRUST_PROXY
        value: "2"
      # Điền trong Render Dashboard khi tạo Blueprint (không lưu trong repo)
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: GOOGLE_DRIVE_CLIENT_ID
        sync: false
      - key: GOOGLE_PICKER_API_KEY
        sync: false
      - key: GOOGLE_CLOUD_PROJECT_NUMBER
        sync: false
